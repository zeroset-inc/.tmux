# enable mouse support
set -g mouse on

# pass window titles to terminal
set -g set-titles on
set -g set-titles-string "#I: #T"

# start window index from 1
set -g base-index 1
setw -g pane-base-index 1

# copy to system clipboard on mouse drag release
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" \; set-option @tab-dragging 0
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" \; set-option @tab-dragging 0

# scroll enters copy mode automatically, exits when you reach the bottom
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# pane navigation (no prefix needed, Option+ijkl, no wrap)
bind -n M-j if -F '#{pane_at_left}' '' 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}' '' 'select-pane -R'
bind -n M-i if -F '#{pane_at_top}' '' 'select-pane -U'
bind -n M-k if -F '#{pane_at_bottom}' '' 'select-pane -D'

# pane management (no prefix needed)
bind -n M-n split-window -h \; select-layout tiled
bind -n M-w kill-pane
bind -n M-o next-layout
bind -n M-g select-pane -m
bind -n M-y run 'tmux swap-pane -s \{marked\} && tmux select-pane -M'

# window navigation (Option+u = next, Option+h = previous)
bind -n M-u if -F '#{window_end_flag}' '' 'next-window'
bind -n M-h if -F '#{window_start_flag}' '' 'previous-window'
bind -n M-m new-window

# scroll mode: Option+Tab to enter, i/k to scroll up/down, q or Escape to exit
bind -n M-Tab if -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'
bind -T copy-mode i send-keys -X -N 2 scroll-up
bind -T copy-mode k send-keys -X -N 2 scroll-down
bind -T copy-mode I send-keys -X halfpage-up
bind -T copy-mode K send-keys -X halfpage-down

# increase scrollback
set -g history-limit 50000

# pane borders with full box around each pane
set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour117
set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g allow-rename off

# claude code native process uses its version number as its process name.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}#{?pane_dead,[dead],}'
set -g pane-border-format " #{pane_index} #{?@name,#{@name},#{b:pane_current_path}} | #{pane_current_command}#{?pane_marked, [marked],}#{?pane_in_mode, [copy],} "

# show pane headers only in split windows.
set -g pane-border-status off
set-hook -g window-layout-changed[90] 'run-shell -b "/usr/bin/perl ~/.config/tmux/ui.pl headers"'
set-hook -g after-kill-pane[90] 'run-shell -b "/usr/bin/perl ~/.config/tmux/ui.pl headers"'
set-hook -g pane-exited[90] 'run-shell -b "/usr/bin/perl ~/.config/tmux/ui.pl headers"'
run-shell -b '/usr/bin/perl ~/.config/tmux/ui.pl headers'

# status bar showing window number and name
set -g status on
set -g status-position top
set -g status-style bg=default,fg=colour245
set -g window-status-format "#{?#{&&:#{@tab-dragging},#{==:#{window_id},#{@drop-before}}},#[fg=colour117]│#[default #{E:window-status-style}], }#{E:@agent-badge}#{p9:#{window_index}: #{window_name}}#{?#{&&:#{@tab-dragging},#{==:#{window_id},#{@drop-after}}},#[fg=colour117]│, }"
set -g window-status-separator " "
set -g window-status-current-style bg=colour117,fg=colour235,bold
set -g status-interval 1
set -g status-left-length 30
set -g status-left "#[fg=colour117] #{?#{m/r:^[0-9]+$,#{session_name}},space ,}#S #[default] "
set -g status-right-length 150
set -g status-right '#[fg=colour245]#(/usr/bin/perl "$HOME/.config/tmux/ui.pl" git #{q:pane_current_path}) '

# Agent lifecycle hooks drive indicators; ignore terminal redraw activity.
setw -g monitor-activity off
set -g visual-activity off
set -g activity-action none
setw -g window-status-activity-style fg=colour220

# aggregate split-pane state; animate working icons at 10 frames per second.
set -g @agent-badge '#{?#{m:*waiting*,#{P:#{@agent-state}}},#{?window_active,,#[fg=colour220]}!#[#{?window_active,#{E:window-status-current-style},#{?#{m:*1*,#{P:#{@agent-unread}}},#{E:window-status-activity-style},#{E:window-status-style}}}] ,#{?#{m:*error*,#{P:#{@agent-state}}},#{?window_active,,#[fg=colour196]}×#[#{?window_active,#{E:window-status-current-style},#{?#{m:*1*,#{P:#{@agent-unread}}},#{E:window-status-activity-style},#{E:window-status-style}}}] ,#{?#{m:*working*,#{P:#{@agent-state}}},#{?window_active,,#[fg=colour220]}#{?#{==:#{@agent-frame},0},⠋,#{?#{==:#{@agent-frame},1},⠙,#{?#{==:#{@agent-frame},2},⠹,#{?#{==:#{@agent-frame},3},⠸,#{?#{==:#{@agent-frame},4},⠼,#{?#{==:#{@agent-frame},5},⠴,#{?#{==:#{@agent-frame},6},⠦,#{?#{==:#{@agent-frame},7},⠧,#{?#{==:#{@agent-frame},8},⠇,⠏}}}}}}}}}#[#{?window_active,#{E:window-status-current-style},#{?#{m:*1*,#{P:#{@agent-unread}}},#{E:window-status-activity-style},#{E:window-status-style}}}] ,#{?#{m:*1*,#{P:#{&&:#{==:#{@agent-state},done},#{==:#{@agent-unread},1}}}},#{?window_active,,#[fg=colour82]}✓#[#{?window_active,#{E:window-status-current-style},#{?#{m:*1*,#{P:#{@agent-unread}}},#{E:window-status-activity-style},#{E:window-status-style}}}] ,}}}}'

set-hook -g session-window-changed[91] 'run-shell -b "/usr/bin/perl ~/.config/tmux/agent-state.pl seen #{window_id}"'
set-hook -g client-session-changed[91] 'run-shell -b "/usr/bin/perl ~/.config/tmux/agent-state.pl seen #{window_id}"'
set-hook -g client-attached[91] 'run-shell -b "/usr/bin/perl ~/.config/tmux/agent-state.pl seen #{window_id}"'

run-shell -b '/usr/bin/perl "$HOME/.config/tmux/agent-spinner.pl" #{q:socket_path}'

# dedicated mouse target for the + after the last tab.
bind -n MouseDown1Control0 new-window

# below 80 columns, show the Tabs button and a separate Git row in repositories.
# wider terminals show the tab list and Git summary together on one row.
set -g @tabs-wide '#[align=left range=left]#{T;=/#{status-left-length}:status-left}#[default norange]#[list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[default range=window|#{window_index} list=#{?window_active,focus,on} #{?window_active,#{E:window-status-current-style},#{?#{m:*1*,#{P:#{@agent-unread}}},#{E:window-status-activity-style},#{E:window-status-style}}}]#{E:window-status-format}#[default norange list=on]#{?loop_last_flag,,#{E:window-status-separator}}}#[default fg=colour117]  #[range=control|0]+#[default norange]#[nolist align=right range=right]#{T;=/#{status-right-length}:status-right}#[default norange]'

set -g @tabs-compact '#[align=left]#{?#{e|<:#{client_width},40},,#[range=left fg=colour117] #{=/10/…:session_name} #[default norange] }#[#{E:window-status-current-style}] #{E:@agent-badge}#{window_index}: #{=/#{e|-:#{client_width},#{?#{e|<:#{client_width},40},14,28}}/…:window_name} #[default]#[nolist align=right range=control|1 bg=colour238 fg=colour117 bold] tabs #[default norange]'

set -g status-format[0] '#{?#{e|<:#{client_width},80},#{E:@tabs-compact},#{E:@tabs-wide}}'
set -g status-format[1] '#{?#{e|<:#{client_width},80},#[align=left] #{T;=/#{e|-:#{client_width},2}:status-right}#[default],}'
bind -n MouseDown1Control1 run-shell -b '/usr/bin/perl "$HOME/.config/tmux/ui.pl" tabs #{q:client_name} #{q:session_id} #{q:window_id}'
bind w run-shell -b '/usr/bin/perl "$HOME/.config/tmux/ui.pl" tabs #{q:client_name} #{q:session_id} #{q:window_id}'

# click the space label to switch sessions or create one.
bind -n MouseDown1StatusLeft run-shell -b '/usr/bin/perl "$HOME/.config/tmux/ui.pl" spaces #{q:client_name} #{q:session_id}'

# right-click menus stay open on release and accept a separate click.
run-shell -b '/usr/bin/perl "$HOME/.config/tmux/ui.pl" menus'

# return to the most recently used space when the current session closes.
set -g detach-on-destroy off

# keep tab numbers consecutive, starting at base-index.
set -g renumber-windows on

# remember the clicked tab, then insert it at the drop target.
bind -n MouseDown1Status switch-client -t = \; set-option -F @drag-window '#{window_id}' \; set-option -F @drag-index '#{window_index}' \; set-option @tab-dragging 0
bind -n MouseDrag1Status set-option @tab-dragging 1 \; set-option -t = -F @drop-before '#{?#{<:#{window_index},#{@drag-index}},#{window_id},}' \; set-option -t = -F @drop-after '#{?#{>:#{window_index},#{@drag-index}},#{window_id},}' \; refresh-client -S
bind -n MouseDragEnd1Status set-option @tab-dragging 0 \; run-shell -b -t = '/usr/bin/perl "$HOME/.config/tmux/ui.pl" reorder #{q:session_id} #{q:window_id}'

# dropping outside the tab list cancels the drag highlight.
bind -n MouseDragEnd1Border set-option @tab-dragging 0
bind -n MouseDragEnd1StatusLeft set-option @tab-dragging 0
bind -n MouseDragEnd1StatusRight set-option @tab-dragging 0
bind -n MouseDragEnd1Control0 set-option @tab-dragging 0

# terminal-default menu backgrounds with blue selection and borders.
set -g menu-style bg=default,fg=colour252
set -g menu-selected-style bg=colour117,fg=colour235,bold
set -g menu-border-style bg=default,fg=colour117
